<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Film Adatbázis</title>
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <style>
        :root { --bg-color: #121212; --card-bg: #1e1e1e; --text-color: #e0e0e0; --accent-color: #00adb5; --secondary-text: #888; }
        body { font-family: -apple-system, sans-serif; background-color: var(--bg-color); color: var(--text-color); padding: 20px; }
        .container { max-width: 600px; margin: 0 auto; }
        h1 { font-size: 24px; text-align: center; color: var(--accent-color); margin-bottom: 20px; }
        input[type="text"] { width: 100%; padding: 15px; font-size: 16px; border: none; border-radius: 12px; background-color: var(--card-bg); color: var(--text-color); box-sizing: border-box; margin-bottom: 20px; outline: none; }
        .status { text-align: center; color: var(--secondary-text); font-size: 14px; margin-bottom: 15px; }
        .movie-card { background-color: var(--card-bg); border-radius: 14px; padding: 16px; margin-bottom: 15px; }
        .magyar-cim { font-size: 18px; font-weight: bold; color: #fff; }
        .eredeti-cim { font-size: 14px; font-style: italic; color: var(--secondary-text); margin-bottom: 12px; }
        .info-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; font-size: 14px; border-top: 1px solid #2d2d2d; padding-top: 10px; }
        .info-item span { display: block; color: var(--secondary-text); font-size: 11px; text-transform: uppercase; }
        .info-item strong { color: #fff; }
    </style>
</head>
<body>
<div class="container">
    <h1>Film Forgalmazás Kereső</h1>
    <input type="text" id="search" placeholder="Film címe vagy részlete..." autocomplete="off">
    <div id="status" class="status">Betöltés...</div>
    <div id="results"></div>
</div>
<script>
    let movieDatabase = [];
    const searchInput = document.getElementById('search');
    const resultsContainer = document.getElementById('results');
    const statusContainer = document.getElementById('status');

    fetch('adatok.json?v=' + Date.now())
        .then(res => res.json())
        .then(data => {
            movieDatabase = data;
            statusContainer.innerText = `${data.length} film kész a keresésre.`;
        }).catch(() => { statusContainer.innerText = "Hiba az adatok beolvasásakor."; });

    searchInput.addEventListener('input', function() {
        const query = this.value.toLowerCase().trim();
        resultsContainer.innerHTML = '';
        if (query.length < 2) return;

        const filtered = movieDatabase.filter(f => 
            f.magyar_cim.toLowerCase().includes(query) || 
            f.eredeti_cim.toLowerCase().includes(query)
        );

        if (filtered.length === 0) {
            resultsContainer.innerHTML = '<div style="text-align:center;color:#888;">Nincs találat.</div>';
            return;
        }

        filtered.slice(0, 50).forEach(f => {
            const nezok = Number(f.nezoszam).toLocaleString('hu-HU') + " fő";
            const bevetel = Number(f.bevetel).toLocaleString('hu-HU') + " Ft";

            const card = document.createElement('div');
            card.className = 'movie-card';
            card.innerHTML = `
                <div class="magyar-cim">${f.magyar_cim}</div>
                <div class="eredeti-cim">${f.eredeti_cim || '-'}</div>
                <div class="info-grid">
                    <div class="info-item"><span>Besutató</span><strong>${f.bemutato}</strong></div>
                    <div class="info-item"><span>Nézőszám</span><strong>${nezok}</strong></div>
                    <div class="info-item" style="grid-column: span 2;"><span>Bevétel</span><strong style="color:#ecc94b;">${bevetel}</strong></div>
                </div>`;
            resultsContainer.appendChild(card);
        });
    });
</script>
</body>
</html>
