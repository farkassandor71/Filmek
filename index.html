<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Film Adatbázis & Statisztika</title>
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <style>
        :root { --bg-color: #121212; --card-bg: #1e1e1e; --text-color: #e0e0e0; --accent-color: #00adb5; --secondary-text: #888; }
        body { font-family: -apple-system, sans-serif; background-color: var(--bg-color); color: var(--text-color); padding: 15px; margin: 0; }
        .container { max-width: 600px; margin: 0 auto; padding-bottom: 30px; }
        h1 { font-size: 22px; text-align: center; color: var(--accent-color); margin-top: 10px; margin-bottom: 2px; }
        .db-date { text-align: center; font-size: 13px; color: #ecc94b; margin-bottom: 15px; font-weight: 500; }
        input[type="text"], select { width: 100%; padding: 12px; font-size: 15px; border: none; border-radius: 10px; background-color: var(--card-bg); color: var(--text-color); box-sizing: border-box; margin-bottom: 12px; outline: none; }
        .status { text-align: center; color: var(--secondary-text); font-size: 13px; margin-bottom: 15px; }
        
        .stats-panel { background: #1a1a1a; border: 1px solid #2d2d2d; border-radius: 12px; padding: 12px; margin-bottom: 15px; }
        .panel-title { font-size: 14px; font-weight: bold; color: var(--accent-color); margin-bottom: 10px; text-transform: uppercase; letter-spacing: 0.5px; }
        .btn-group { display: flex; gap: 8px; margin-bottom: 12px; }
        button { flex: 1; padding: 10px; background: var(--accent-color); color: #fff; border: none; border-radius: 8px; font-size: 13px; font-weight: bold; cursor: pointer; }
        button:active { opacity: 0.8; }
        .select-row { display: flex; gap: 8px; margin-bottom: 10px; }
        .select-row select { margin-bottom: 0; }

        .movie-card { background-color: var(--card-bg); border-radius: 12px; padding: 14px; margin-bottom: 12px; position: relative; }
        .rank-badge { position: absolute; top: 12px; right: 12px; background: #ecc94b; color: #000; font-size: 11px; font-weight: bold; padding: 2px 6px; border-radius: 4px; }
        .magyar-cim { font-size: 17px; font-weight: bold; color: #fff; padding-right: 40px; }
        .eredeti-cim { font-size: 13px; font-style: italic; color: var(--secondary-text); margin-bottom: 4px; }
        .forgalmazo-info { font-size: 12px; color: var(--accent-color); margin-bottom: 10px; }
        .info-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; font-size: 13px; border-top: 1px solid #2d2d2d; padding-top: 8px; }
        .info-item span { display: block; color: var(--secondary-text); font-size: 10px; text-transform: uppercase; }
        .info-item strong { color: #fff; }
    </style>
</head>
<body>
<div class="container">
    <h1>Film Adatbázis & Statok</h1>
    <div id="dbDate" class="db-date">Adatbázis: Frissítés alatt...</div>
    
    <input type="text" id="search" placeholder="Keresés cím alapján..." autocomplete="off">
    <div id="status" class="status">Betöltés...</div>

    <div class="stats-panel">
        <div class="panel-title">Top 10 Ranglisták</div>
        <div class="btn-group">
            <button onclick="showAllTimeTop10()">Minden idők Top 10</button>
        </div>
        
        <div class="select-row">
            <select id="filterYear" onchange="showFilteredTop10()">
                <option value="">-- Év választás --</option>
            </select>
            <select id="filterMonth" onchange="showFilteredTop10()">
                <option value="">-- Hónap --</option>
                <option value="01">Január</option>
                <option value="02">Február</option>
                <option value="03">Március</option>
                <option value="04">Április</option>
                <option value="05">Május</option>
                <option value="06">Június</option>
                <option value="07">Július</option>
                <option value="08">Augusztus</option>
                <option value="09">Szeptember</option>
                <option value="10">Október</option>
                <option value="11">November</option>
                <option value="12">December</option>
            </select>
        </div>

        <select id="filterForgalmazo" onchange="showForgalmazoTop10()">
            <option value="">-- Forgalmazó szerinti Top 10 --</option>
        </select>
    </div>

    <div id="results"></div>
</div>

<script>
    let movieDatabase = [];
    const searchInput = document.getElementById('search');
    const resultsContainer = document.getElementById('results');
    const statusContainer = document.getElementById('status');
    const dbDateContainer = document.getElementById('dbDate');
    const filterYear = document.getElementById('filterYear');
    const filterForgalmazo = document.getElementById('filterForgalmazo');

    fetch('adatok.json?v=' + Date.now())
        .then(res => res.json())
        .then(data => {
            // Mivel az új struktúrában az adatok a 'filmek' kulcs alatt vannak:
            movieDatabase = data.filmek || [];
            dbDateContainer.innerText = `Adatbázis: ${data.frissitve || 'Ismeretlen dátum'}`;
            statusContainer.innerText = `${movieDatabase.length} film kész a keresésre.`;
            setupFilters();
        }).catch(() => { 
            statusContainer.innerText = "Hiba az adatok beolvasásakor."; 
            dbDateContainer.innerText = "Adatbázis: Nem elérhető";
        });

    function setupFilters() {
        const years = new Set();
        const forgalmazok = new Set();

        movieDatabase.forEach(f => {
            if (f.bemutato && f.bemutato.includes('-')) {
                const year = f.bemutato.split('-')[0];
                if (year && year.length === 4) years.add(year);
            }
            if (f.forgalmazo) forgalmazok.add(f.forgalmazo);
        });

        Array.from(years).sort().reverse().forEach(y => {
            filterYear.innerHTML += `<option value="${y}">${y}</option>`;
        });

        Array.from(forgalmazok).sort().forEach(forg => {
            if(forg !== "Ismeretlen") {
                filterForgalmazo.innerHTML += `<option value="${forg}">${forg}</option>`;
            }
        });
    }

    function renderMovies(movies, showRank = false) {
        resultsContainer.innerHTML = '';
        if (movies.length === 0) {
            resultsContainer.innerHTML = '<div style="text-align:center;color:#888;padding:20px;">Nincs találat a megadott szűrésre.</div>';
            return;
        }

        movies.forEach((f, index) => {
            const nezok = Number(f.nezoszam).toLocaleString('hu-HU') + " fő";
            const bevetel = Number(f.bevetel).toLocaleString('hu-HU') + " Ft";
            
            const card = document.createElement('div');
            card.className = 'movie-card';
            card.innerHTML = `
                ${showRank ? `<div class="rank-badge">#${index + 1}</div>` : ''}
                <div class="magyar-cim">${f.magyar_cim}</div>
                <div class="eredeti-cim">${f.eredeti_cim || '-'}</div>
                <div class="forgalmazo-info">${f.forgalmazo || 'Ismeretlen'}</div>
                <div class="info-grid">
                    <div class="info-item"><span>Bemutató</span><strong>${f.bemutato}</strong></div>
                    <div class="info-item"><span>Nézőszám</span><strong>${nezok}</strong></div>
                    <div class="info-item" style="grid-column: span 2;"><span>Bevétel</span><strong style="color:#ecc94b;">${bevetel}</strong></div>
                </div>`;
            resultsContainer.appendChild(card);
        });
    }

    searchInput.addEventListener('input', function() {
        const query = this.value.toLowerCase().trim();
        if (query.length < 2) { resultsContainer.innerHTML = ''; return; }

        filterYear.value = ""; filterMonth.value = ""; filterForgalmazo.value = "";

        const filtered = movieDatabase.filter(f => 
            f.magyar_cim.toLowerCase().includes(query) || 
            f.eredeti_cim.toLowerCase().includes(query)
        );
        renderMovies(filtered.slice(0, 50), false);
    });

    function showAllTimeTop10() {
        searchInput.value = ""; filterYear.value = ""; filterMonth.value = ""; filterForgalmazo.value = "";
        const sorted = [...movieDatabase].sort((a, b) => b.bevetel - a.bevetel);
        renderMovies(sorted.slice(0, 10), true);
    }

    function showFilteredTop10() {
        searchInput.value = ""; filterForgalmazo.value = "";
        const targetYear = filterYear.value;
        const targetMonth = filterMonth.value;

        if (!targetYear) return;

        const filtered = movieDatabase.filter(f => {
            if (!f.bemutato || !f.bemutato.includes('-')) return false;
            const parts = f.bemutato.split('-');
            const matchYear = parts[0] === targetYear;
            const matchMonth = targetMonth ? parts[1] === targetMonth : true;
            return matchYear && matchMonth;
        });

        const sorted = filtered.sort((a, b) => b.bevetel - a.bevetel);
        renderMovies(sorted.slice(0, 10), true);
    }

    function showForgalmazoTop10() {
        searchInput.value = ""; filterYear.value = ""; filterMonth.value = "";
        const targetForg = filterForgalmazo.value;
        if (!targetForg) return;

        const filtered = movieDatabase.filter(f => f.forgalmazo === targetForg);
        const sorted = filtered.sort((a, b) => b.bevetel - a.bevetel);
        renderMovies(sorted.slice(0, 10), true);
    }
</script>
</body>
</html>
